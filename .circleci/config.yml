version: 2.1

orbs:
  win: circleci/windows@5.1.1

# Crimson Ledger pipeline: jobs check, build-linux, build-windows, build-macos, app-release.
# The workflow runs only for `vX.Y.Z` tags; branch pushes build nothing.
commands:
  app-setup:
    steps:
      - checkout
      - run: {name: Show docker, command: docker --version}

jobs:
  check:
    machine: {image: ubuntu-2404:2024.11.1}
    steps:
      - app-setup
      - run: {name: Lint, vet, test, vuln scan, coverage gate, command: docker build -f Dockerfile.build --target check .}
      - run: {name: Package script test, command: scripts/package-test.sh}
  build-linux:
    machine: {image: ubuntu-2404:2024.11.1}
    steps:
      - app-setup
      - run:
          name: Build Linux, Windows and Lambda artifacts
          command: docker build -f Dockerfile.build --target artifacts --build-arg VERSION="$(cat VERSION)" --output type=local,dest=dist .
      - persist_to_workspace: {root: ., paths: [dist/linux-*, dist/lambda]}
  build-windows:
    executor: {name: win/default}
    steps:
      - checkout
      - run:
          name: Install Go 1.26.11 (checksum pinned)
          shell: powershell.exe
          command: |
            $ErrorActionPreference = 'Stop'
            Invoke-WebRequest https://go.dev/dl/go1.26.11.windows-amd64.zip -OutFile $env:TEMP\go.zip
            if ((Get-FileHash $env:TEMP\go.zip -Algorithm SHA256).Hash -ne '71ae086f0137e665f855a811cc119152b6a783e0bbc1b906e709f46d80141eb0') { throw 'go.zip checksum mismatch' }
            Remove-Item -Recurse -Force C:\go -ErrorAction SilentlyContinue
            Expand-Archive $env:TEMP\go.zip -DestinationPath C:\
            [Environment]::SetEnvironmentVariable('PATH', "C:\go\bin;" + $env:PATH, 'Process')
            C:\go\bin\go.exe version
      - run:
          name: Build the Windows binaries natively
          shell: powershell.exe
          command: |
            $env:PATH = "C:\go\bin;" + $env:PATH
            scripts\build-windows.ps1 (Get-Content VERSION).Trim()
      - run:
          name: Selftest on a Windows machine with WebView2
          shell: powershell.exe
          command: scripts\windows-smoke.ps1 dist\windows-amd64
      - persist_to_workspace: {root: ., paths: [dist/windows-amd64]}
  build-macos:
    macos: {xcode: "16.4.0"}
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install Go 1.26.11 (the macOS image has none; checksum pinned)
          command: |
            curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.26.11.darwin-arm64.tar.gz
            echo "e3a42e67a7a8acf450ebada2b074c7ca863000ca514907b7185b45e8f5cdff57  /tmp/go.tgz" | shasum -a 256 -c -
            sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tgz
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
            /usr/local/go/bin/go version
      - run: {name: Universal binaries (arm64 + amd64, ad-hoc signed), command: scripts/build-macos.sh "$(cat VERSION)"}
      - run:
          name: Selftest on the runner
          command: dist/macos-universal/crimson-ledger --selftest && dist/macos-universal/crimson-scout --selftest
      - persist_to_workspace: {root: ., paths: [dist/macos-universal]}
  app-release:
    docker: [{image: "cimg/go:1.26"}]
    steps:
      - checkout
      - attach_workspace: {at: .}
      - run:
          name: Tag must match VERSION
          command: test "$CIRCLE_TAG" = "v$(cat VERSION)" || { echo "tag $CIRCLE_TAG != v$(cat VERSION)" >&2; exit 1; }
      - run: {name: Package and checksum, command: scripts/package.sh "$(cat VERSION)" dist release}
      - run:
          name: Publish (refuses forks)
          command: |
            [ -z "${CIRCLE_PR_NUMBER:-}" ] || { echo "release refuses to run for a fork PR" >&2; exit 1; }
            : "${GITHUB_TOKEN:?set GITHUB_TOKEN in the app-release context}"
            curl -fsSL "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz" | tar -xz -C /tmp
            GH_TOKEN="$GITHUB_TOKEN" /tmp/gh_2.63.2_linux_amd64/bin/gh release create "$CIRCLE_TAG" release/* \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" --verify-tag --title "Crimson Ledger $CIRCLE_TAG" \
              --notes "Verify downloads against SHA256SUMS. See INSTALL.md inside each archive."

workflows:
  app:
    jobs:
      - check: {filters: {tags: {only: /^v\d+\.\d+\.\d+$/}, branches: {ignore: /.*/}}}
      - build-linux: {requires: [check], filters: {tags: {only: /^v\d+\.\d+\.\d+$/}, branches: {ignore: /.*/}}}
      - build-windows: {requires: [check], filters: {tags: {only: /^v\d+\.\d+\.\d+$/}, branches: {ignore: /.*/}}}
      - build-macos:
          requires: [check]
          filters: {tags: {only: /^v\d+\.\d+\.\d+$/}, branches: {ignore: /.*/}}
      - app-release:
          context: app-release
          requires: [build-linux, build-windows, build-macos]
          filters: {tags: {only: /^v\d+\.\d+\.\d+$/}, branches: {ignore: /.*/}}
